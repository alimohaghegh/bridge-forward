name: Channel mirror retry

# Safety net for channel mirroring: re-sends channel posts still queued
# (e.g. Bale was unreachable and no new post arrived since) and picks up
# deleted posts. Every channel update already does this; this run covers
# quiet periods. Prints only per-channel status words.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: drain-bridge-forward
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write config from secrets
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
        run: node scripts/write-config.mjs

      - name: Fetch cloud state
        run: npx tgcloud fetch

      - name: Send queued posts and check deletions
        run: |
          npx tgcloud run handlers/message '{ __drain: true }'

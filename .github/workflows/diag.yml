name: Bale diagnostics

# Probes Bale (__diag, __probe, __mirrortest) or EitaaYar (__eitaa: reachability,
# getMe, error shapes, Eitaa web gateway) from Telegram Serverless. Deploys
# nothing; prints timings, codes and counts only (CI logs are public).
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Payload flag to run (__diag, __probe, __mirrortest or __eitaa)'
        default: '__diag'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write config from secrets
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          EITAA_YAR_TOKEN: ${{ secrets.EITAA_YAR_TOKEN }}
          EITAA_OPERATOR_USERNAME: ${{ secrets.EITAA_OPERATOR_USERNAME }}
          EITAA_TOKEN_KEY: ${{ secrets.EITAA_TOKEN_KEY }}
        run: |
          set +x
          node scripts/write-config.mjs

      - name: Fetch cloud state
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud fetch

      - name: Probe (run 1)
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          PROBE: ${{ inputs.probe }}
        run: |
          case "$PROBE" in __diag|__probe|__mirrortest|__eitaa) ;; *) echo "unknown probe"; exit 1;; esac
          npx tgcloud run handlers/message "{ $PROBE: true }" || true

      - name: Probe (run 2)
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          PROBE: ${{ inputs.probe }}
        run: |
          case "$PROBE" in __diag|__probe|__mirrortest|__eitaa) ;; *) echo "unknown probe"; exit 1;; esac
          npx tgcloud run handlers/message "{ $PROBE: true }" || true

name: Bale diagnostics

# Probes Bale from Telegram Serverless (getMe, and a test message to the
# owner's linked Bale chat). Deploys nothing; prints timings and error codes only.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Payload flag to run (__diag or __probe)'
        default: '__diag'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write config from secrets
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
        run: node scripts/write-config.mjs

      - name: Fetch cloud state
        run: npx tgcloud fetch

      - name: Probe (run 1)
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          case "$PROBE" in __diag|__probe) ;; *) echo "unknown probe"; exit 1;; esac
          npx tgcloud run handlers/message "{ $PROBE: true }" || true

      - name: Probe (run 2)
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          case "$PROBE" in __diag|__probe) ;; *) echo "unknown probe"; exit 1;; esac
          npx tgcloud run handlers/message "{ $PROBE: true }" || true

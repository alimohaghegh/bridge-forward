name: Bale diagnostics

# Probes Bale (__diag, __probe, __mirrortest) or EitaaYar (__eitaa: reachability,
# getMe, error shapes, Eitaa web gateway) from Telegram Serverless. Deploys
# nothing; prints timings, codes and counts only (CI logs are public).
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Payload flag to run (__diag, __probe, __mirrortest, __eitaa or __eitaa_state)'
        default: '__diag'
      arg:
        description: 'Optional number for the probe (e.g. the post to re-send with __eitaa_resend)'
        default: ''

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # For comparison with the Serverless runtime: can a non-Iranian server
      # (this GitHub runner) reach Eitaa at all? No secrets involved.
      - name: Reachability from the GitHub runner
        run: |
          for u in https://eitaayar.ir/ https://eitaa.com/ https://sajad.eitaa.ir/eitaa/; do
            r=$(curl -sS -m 15 -o /dev/null -w '%{http_code} %{time_total}s' "$u" 2>&1 | tail -1)
            echo "$u -> $r"
            echo "::notice title=runner reach::$u -> $r"
          done

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write config from secrets
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          EITAA_YAR_TOKEN: ${{ secrets.EITAA_YAR_TOKEN }}
          EITAA_OPERATOR_USERNAME: ${{ secrets.EITAA_OPERATOR_USERNAME }}
          EITAA_TOKEN_KEY: ${{ secrets.EITAA_TOKEN_KEY }}
          EITAA_RELAY_URL: ${{ secrets.EITAA_RELAY_URL }}
          EITAA_RELAY_KEY: ${{ secrets.EITAA_RELAY_KEY }}
        run: |
          set +x
          node scripts/write-config.mjs

      - name: Fetch cloud state
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud fetch

      - name: Probe (run 1)
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          PROBE: ${{ inputs.probe }}
          ARG: ${{ inputs.arg }}
        run: |
          case "$ARG" in '') VALUE=true;; *[!0-9]*) echo "arg must be a number"; exit 1;; *) VALUE=$ARG;; esac
          case "$PROBE" in __diag|__probe|__mirrortest|__eitaa|__eitaa_state|__eitaa_fmt2|__eitaa_fmt3|__eitaa_render|__eitaa_resend|__eitaa_fmt4|__eitaa_fmt5|__health) ;; *) echo "unknown probe"; exit 1;; esac
          bash scripts/run-and-annotate.sh "$PROBE" "{ $PROBE: $VALUE }" || true

      - name: Probe (run 2)
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          PROBE: ${{ inputs.probe }}
        run: |
          # Probes that post messages run once.
          case "$PROBE" in __eitaa_fmt2|__eitaa_fmt3|__eitaa_render|__eitaa_resend|__eitaa_fmt4|__eitaa_fmt5|__health) exit 0;; esac
          case "$PROBE" in __diag|__probe|__mirrortest|__eitaa|__eitaa_state|__eitaa_fmt2|__eitaa_fmt3|__eitaa_render|__eitaa_resend|__eitaa_fmt4|__eitaa_fmt5|__health) ;; *) echo "unknown probe"; exit 1;; esac
          bash scripts/run-and-annotate.sh "$PROBE" "{ $PROBE: true }" || true
